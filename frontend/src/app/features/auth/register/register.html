<!--
  Built on the sign-in page's layout and stylesheet, so the two doors into the
  bank look like the same building. They had drifted: this one was still on
  the original dark styling long after every other screen had moved on.
-->
<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">B</div>
      <div>
        <h1>BankFlow</h1>
        <span>Digital Banking Platform</span>
      </div>
    </div>

    <div class="welcome">
      <h2>Create your account</h2>
      <p>Register, then complete your details so the bank can open an account for you.</p>
    </div>

    <form (ngSubmit)="register()">

      <div class="field">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
          maxlength="50"
        />
      </div>

      <div class="field">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="At least 8 characters"
          autocomplete="new-password"
          required
          minlength="8"
        />
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm your password"
          autocomplete="new-password"
          required
        />
      </div>

      @if (errorMessage()) {
        <div class="error">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="success">
          {{ successMessage() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          Creating account...
        } @else {
          Create account
        }
      </button>

    </form>

    <div class="register-link">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </div>

  </div>

</div>
