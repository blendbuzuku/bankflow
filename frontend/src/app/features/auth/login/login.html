<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">B</div>
      <div>
        <h1>BankFlow</h1>
        <span>Digital Banking Platform</span>
      </div>
    </div>

    <div class="welcome">
      <h2>Welcome back</h2>
      <p>Sign in to access your banking dashboard.</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="field">
        <label for="username">Username</label>

        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          placeholder="Enter your username"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Signing in...
        } @else {
          Sign in
        }

      </button>

    </form>

    <div class="register-link">
      Don't have an account?
      <a routerLink="/register">Create an account</a>
    </div>

  </div>

</div>
