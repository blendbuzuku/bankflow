@if (crumbs().length) {
  <nav class="crumbs" aria-label="Breadcrumb">
    <ol>
      @for (c of crumbs(); track $index) {
        <li>
          @if (c.path) {
            <a [routerLink]="c.path">{{ c.label }}</a>
          } @else {
            <span aria-current="page">{{ c.label }}</span>
          }

          @if (!$last) {
            <span class="sep" aria-hidden="true">›</span>
          }
        </li>
      }
    </ol>
  </nav>
}
