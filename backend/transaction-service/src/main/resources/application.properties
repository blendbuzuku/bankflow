spring.application.name=transaction-service

server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway. Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# All three services share one schema, so each keeps its own migration history
# table and migrates only the tables it owns.
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_transaction
# Baseline at 0 so V1 always runs. The three services share one schema, so once
# any of them has created its tables the schema is no longer empty -- baselining
# at 1 there would make the others skip their own V1 and never build their own
# tables. Every V1 statement is CREATE ... IF NOT EXISTS, so re-running it
# against a database that predates Flyway is a no-op.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

bankflow.account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8080}

# Four-eyes control: payments at or above these amounts need a second approver.
# Per currency, because an amount only means something alongside one.
bankflow.approval.enabled=true
bankflow.approval.default-threshold=10000.00
bankflow.approval.thresholds.EUR=10000.00
bankflow.approval.thresholds.USD=10000.00
bankflow.approval.thresholds.GBP=8000.00
bankflow.approval.thresholds.CHF=9000.00

# Customer self-service. Narrower than what a teller may do: a customer has had
# no identity check beyond a password, so RTGS is excluded and amounts are
# capped. Larger or higher-value payments go through a branch.
bankflow.customer.self-service-enabled=true
bankflow.customer.permitted-rails=INTERNAL,KIPS_ACH
bankflow.customer.default-limit=5000.00
bankflow.customer.limits.EUR=5000.00
bankflow.customer.limits.USD=5000.00
bankflow.customer.limits.GBP=4000.00
bankflow.customer.limits.CHF=4500.00

# Service-to-service identity used for ledger calls into account-service.
bankflow.service.name=transaction-service
bankflow.service.token-ttl-seconds=60

# The scheme message archive. Documents rather than rows: kept verbatim, never
# updated, and shaped differently for every message type. Money stays in
# Postgres above -- this holds only what was said to and by the scheme.
# spring.data.mongodb.* was deprecated to error level in Boot 4 -- the key is
# read from spring.mongodb.* now. Set on the old key it is silently ignored and
# the default applies, which is mongodb://localhost/test: the app works, and
# quietly writes to a database called test.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/bankflow}
spring.data.mongodb.auto-index-creation=true
